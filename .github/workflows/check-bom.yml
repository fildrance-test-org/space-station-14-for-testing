name: BOM Check

on:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true  # We only care about latest.

jobs:
  build:
    name: BOM Check
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2
        persist-credentials: true

    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v47.0.6
      with:
        write_output_files: true
        files: |
          **.cs
          **.ftl
          **.json
          **.yml

    - name: Check for BOMs
      if: steps.changed-files.outputs.any_changed == 'true'
      run: |
        if cat .github/outputs/all_changed_files.txt | xargs grep -lP $'^\xEF\xBB\xBF'; then
          echo "BOM detected!"
          exit 1
        fi

    - name: Complain
      if: failure()
      run: |
        echo -e "You have committed files with UTF-8 (BOM) encoding. If you are using Rider, Settings > Editor > File Encodings, and set the \"Create UTF-8 Files\" to \"With No BOM\" \nFollow the steps here https://jetbrains.com "
        exit 1
